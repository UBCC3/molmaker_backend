<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" role="img" aria-labelledby="title description">
  <title id="title">Database-backed job orchestration</title>
  <desc id="description">The API stores a submitting job and its exact calculation inputs in PostgreSQL. Three independent reconcilers send versioned JSON requests through a restricted cluster dispatch command to submit and monitor Slurm jobs and upload artifacts to S3.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e87522"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#526fe8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#159a62"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #5b6472; }
    .panel-title { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #526173; }
    .column-title { font-size: 11.5px; font-weight: 700; letter-spacing: 1px; fill: #738094; }
    .node-title { font-size: 16px; font-weight: 700; }
    .node-body { font-size: 12.5px; fill: #4b5565; }
    .node-small { font-size: 11.2px; fill: #5b6472; }
    .action { font-size: 11.7px; font-weight: 700; }
    .command { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.3px; fill: #64748b; }
    .blue { fill: #2563eb; }
    .orange { fill: #c65f16; }
    .indigo { fill: #445fc6; }
    .green { fill: #117b50; }
    .footer { font-size: 12.5px; font-weight: 600; fill: #526173; }
  </style>

  <text class="title" x="700" y="34" text-anchor="middle">Database-backed job orchestration</text>
  <text class="subtitle" x="700" y="58" text-anchor="middle">The API saves job state and input; supervised workers advance the calculation through a restricted JSON interface</text>

  <!-- Public request path. -->
  <rect x="25" y="78" width="1350" height="142" rx="16" fill="#f4f8ff" stroke="#b7d3f2" stroke-width="1.5"/>
  <text class="panel-title" x="50" y="103">PUBLIC REQUEST PATH</text>

  <g filter="url(#shadow)">
    <rect x="60" y="126" width="210" height="64" rx="10" fill="#ffffff" stroke="#9bbce4" stroke-width="1.5"/>
    <text class="node-title" x="165" y="152" text-anchor="middle">Frontend</text>
    <text class="node-body" x="165" y="175" text-anchor="middle">create a job; poll by job_id</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="114" width="300" height="88" rx="10" fill="#ffffff" stroke="#8da1ba" stroke-width="1.5"/>
    <text class="node-title" x="500" y="143" text-anchor="middle">FastAPI service</text>
    <text class="node-body" x="500" y="166" text-anchor="middle">validate metadata, XYZ, and keywords</text>
    <text class="node-body" x="500" y="188" text-anchor="middle">save the job and return 201</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="108" width="445" height="100" rx="11" fill="#edf4ff" stroke="#2563eb" stroke-width="2.4"/>
    <text class="node-title" x="1102" y="137" text-anchor="middle">PostgreSQL = durable hand-off</text>
    <text class="node-body" x="1102" y="161" text-anchor="middle">jobs: state · attempts · scheduler ID · outcome</text>
    <text class="node-body" x="1102" y="183" text-anchor="middle">job_inputs: input_xyz · optional keywords</text>
  </g>

  <path d="M270 158 H350" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text class="action blue" x="310" y="145" text-anchor="middle">call job API</text>
  <path d="M650 158 H880" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text class="action blue" x="765" y="143" text-anchor="middle">commit job + inputs together</text>
  <text class="command" x="765" y="178" text-anchor="middle">status = submitting</text>

  <!-- Worker panel. -->
  <rect x="25" y="245" width="1350" height="620" rx="16" fill="#ffffff" stroke="#c8d0dc" stroke-width="1.5"/>
  <text class="panel-title" x="50" y="272">THREE INDEPENDENT SUPERVISED PROCESSES</text>
  <text class="column-title" x="180" y="298" text-anchor="middle">RECONCILER</text>
  <text class="column-title" x="475" y="298" text-anchor="middle">VERSIONED JSON REQUEST</text>
  <text class="column-title" x="820" y="298" text-anchor="middle">RESTRICTED ALLIANCE DISPATCH</text>
  <text class="column-title" x="1190" y="298" text-anchor="middle">SLURM OR S3</text>

  <!-- Database state bus. -->
  <path d="M1102 208 V230 H42 V771" fill="none" stroke="#4f78c8" stroke-width="2.3" stroke-dasharray="7 6"/>
  <path d="M42 320 H55" fill="none" stroke="#4f78c8" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
  <path d="M42 504 H55" fill="none" stroke="#4f78c8" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
  <path d="M42 688 H55" fill="none" stroke="#4f78c8" stroke-width="2.3" marker-end="url(#arrow-blue)"/>
  <rect x="580" y="219" width="250" height="24" rx="6" fill="#ffffff"/>
  <text class="action blue" x="705" y="236" text-anchor="middle">select by status · commit the next state</text>

  <!-- Submission lane. -->
  <g filter="url(#shadow)">
    <rect x="55" y="320" width="250" height="116" rx="11" fill="#fff4e8" stroke="#e87522" stroke-width="2.3"/>
    <text class="node-title" x="180" y="349" text-anchor="middle">1. Submission reconciler</text>
    <text class="node-body" x="180" y="380" text-anchor="middle">load input and record the attempt</text>
    <text class="node-body" x="180" y="405" text-anchor="middle">send the submission request</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="320" width="240" height="116" rx="10" fill="#fffaf4" stroke="#d6955d" stroke-width="1.7"/>
    <text class="node-title" x="475" y="349" text-anchor="middle">submit</text>
    <text class="node-small" x="475" y="379" text-anchor="middle">settings + job UUID + inputs</text>
    <text class="node-small" x="475" y="404" text-anchor="middle">recover_existing on retries</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="310" width="320" height="136" rx="10" fill="#ffffff" stroke="#d6955d" stroke-width="1.8"/>
    <text class="node-title" x="820" y="343" text-anchor="middle">Recover and prepare on Alliance</text>
    <text class="node-small" x="820" y="371" text-anchor="middle">retry lookup: squeue, then recent sacct</text>
    <text class="node-small" x="820" y="395" text-anchor="middle">create jobs/{job_id}</text>
    <text class="node-small" x="820" y="419" text-anchor="middle">write input.xyz · keywords.json · slurm.sh</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="320" width="260" height="116" rx="10" fill="#fffaf4" stroke="#d6955d" stroke-width="1.8"/>
    <text class="node-title" x="1190" y="349" text-anchor="middle">Slurm job</text>
    <text class="node-small" x="1190" y="382" text-anchor="middle">queue the calculation script</text>
    <text class="node-small" x="1190" y="407" text-anchor="middle">return the Slurm ID</text>
  </g>

  <path d="M305 378 H355" fill="none" stroke="#e87522" stroke-width="3.4" marker-end="url(#arrow-orange)"/>
  <text class="action orange" x="330" y="363" text-anchor="middle">build request</text>
  <path d="M595 378 H660" fill="none" stroke="#e87522" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
  <text class="action orange" x="627" y="345" text-anchor="middle">send once</text>
  <text class="command" x="627" y="415" text-anchor="middle">SSH stdin</text>
  <path d="M980 378 H1060" fill="none" stroke="#e87522" stroke-width="3.5" marker-end="url(#arrow-orange)"/>
  <text class="action orange" x="1020" y="346" text-anchor="middle">submit script</text>
  <text class="command" x="1020" y="415" text-anchor="middle">sbatch --parsable</text>

  <!-- Status lane. -->
  <g filter="url(#shadow)">
    <rect x="55" y="504" width="250" height="116" rx="11" fill="#eef2ff" stroke="#526fe8" stroke-width="2.3"/>
    <text class="node-title" x="180" y="533" text-anchor="middle">2. Status reconciler</text>
    <text class="node-body" x="180" y="564" text-anchor="middle">batch submitted and running jobs</text>
    <text class="node-body" x="180" y="589" text-anchor="middle">save scheduler state and runtime</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="504" width="240" height="116" rx="10" fill="#f7f8ff" stroke="#8595e8" stroke-width="1.7"/>
    <text class="node-title" x="475" y="533" text-anchor="middle">status-batch</text>
    <text class="node-small" x="475" y="565" text-anchor="middle">up to STATUS_BATCH_SIZE IDs</text>
    <text class="node-small" x="475" y="590" text-anchor="middle">cancel request when needed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="504" width="320" height="116" rx="10" fill="#f7f8ff" stroke="#8595e8" stroke-width="1.8"/>
    <text class="node-title" x="820" y="533" text-anchor="middle">Read scheduler state</text>
    <text class="node-small" x="820" y="565" text-anchor="middle">state · exit code · elapsed seconds</text>
    <text class="node-small" x="820" y="590" text-anchor="middle">request cancellation when needed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="504" width="260" height="116" rx="10" fill="#f7f8ff" stroke="#8595e8" stroke-width="1.8"/>
    <text class="node-title" x="1190" y="533" text-anchor="middle">Slurm accounting</text>
    <text class="node-small" x="1190" y="565" text-anchor="middle">one sacct query per batch</text>
    <text class="node-small" x="1190" y="590" text-anchor="middle">terminal outcome → finalising</text>
  </g>

  <path d="M305 562 H355" fill="none" stroke="#526fe8" stroke-width="3.4" marker-end="url(#arrow-indigo)"/>
  <text class="action indigo" x="330" y="547" text-anchor="middle">build request</text>
  <path d="M595 562 H660" fill="none" stroke="#526fe8" stroke-width="3.5" marker-end="url(#arrow-indigo)"/>
  <text class="action indigo" x="627" y="530" text-anchor="middle">send batch</text>
  <text class="command" x="627" y="599" text-anchor="middle">SSH stdin</text>
  <path d="M980 562 H1060" fill="none" stroke="#526fe8" stroke-width="3.5" marker-end="url(#arrow-indigo)"/>
  <text class="action indigo" x="1020" y="530" text-anchor="middle">query / cancel</text>
  <text class="command" x="1020" y="599" text-anchor="middle">sacct / scancel</text>

  <!-- Finalisation lane. -->
  <g filter="url(#shadow)">
    <rect x="55" y="688" width="250" height="122" rx="11" fill="#eaf8f0" stroke="#159a62" stroke-width="2.3"/>
    <text class="node-title" x="180" y="717" text-anchor="middle">3. Finalisation reconciler</text>
    <text class="node-body" x="180" y="749" text-anchor="middle">check existing artifact keys</text>
    <text class="node-body" x="180" y="774" text-anchor="middle">create fresh PUT URLs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="688" width="240" height="122" rx="10" fill="#f4fbf7" stroke="#62b88f" stroke-width="1.7"/>
    <text class="node-title" x="475" y="717" text-anchor="middle">upload-artifacts</text>
    <text class="node-small" x="475" y="749" text-anchor="middle">job outcome + calculation type</text>
    <text class="node-small" x="475" y="774" text-anchor="middle">fresh presigned URLs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="688" width="320" height="122" rx="10" fill="#f4fbf7" stroke="#62b88f" stroke-width="1.8"/>
    <text class="node-title" x="820" y="717" text-anchor="middle">Alliance artifact uploader</text>
    <text class="node-small" x="820" y="749" text-anchor="middle">archive and upload available files</text>
    <text class="node-small" x="820" y="774" text-anchor="middle">remove the job directory on success</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="688" width="260" height="122" rx="10" fill="#eaf8f0" stroke="#159a62" stroke-width="1.9"/>
    <text class="node-title" x="1190" y="717" text-anchor="middle">S3 object storage</text>
    <text class="node-small" x="1190" y="749" text-anchor="middle">job archive + result artifacts</text>
    <text class="node-small" x="1190" y="774" text-anchor="middle">deterministic object keys</text>
  </g>

  <path d="M305 749 H355" fill="none" stroke="#159a62" stroke-width="3.4" marker-end="url(#arrow-green)"/>
  <text class="action green" x="330" y="734" text-anchor="middle">build request</text>
  <path d="M595 749 H660" fill="none" stroke="#159a62" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  <text class="action green" x="627" y="717" text-anchor="middle">send URLs</text>
  <text class="command" x="627" y="786" text-anchor="middle">SSH stdin</text>
  <path d="M980 749 H1060" fill="none" stroke="#159a62" stroke-width="3.5" marker-end="url(#arrow-green)"/>
  <text class="action green" x="1020" y="717" text-anchor="middle">upload files</text>
  <text class="command" x="1020" y="786" text-anchor="middle">presigned HTTPS PUT</text>

</svg>
